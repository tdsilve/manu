[project]
name = "manu"
version = "0.1.0"
description = "Manu: perguntas sobre manuais de eletrodomésticos com citação de página"
requires-python = ">=3.12"
# Só o que a API usa em produção: o deploy na Vercel instala apenas esta lista
# (limite de 500 MB por função). O chromadb completo (~250 MB de dependências), a extração de PDF e o
# servidor local ficam no extra "local": em produção o Chroma Cloud é acessado por HTTP (manu/chroma_http.py).
dependencies = [
    "pyyaml>=6",
    "httpx>=0.27",
    "fastapi>=0.115",
    "anthropic>=0.40",
]

[project.optional-dependencies]
local = [
    "chromadb>=1.0",
    "pdfplumber>=0.11",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8",
    "fpdf2>=2.8",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
manu-extract = "manu.extraction:main"
manu-validate = "manu.registry:main"
manu-index = "manu.indexing:main"
manu-eval = "manu.evaluation:main"
manu-missing = "manu.missing:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.vercel]
entrypoint = "manu.main:app"

[tool.setuptools]
packages = ["manu"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true
