# Gabarito de avaliação (ticket 07).
#
# Cada item:
#   id         identificador curto e estável (q01, q02, ...)
#   question   em linguagem leiga, como um usuário escreveria
#   category   geladeira | micro-ondas
#   expected   lista de {manual_id, pages: [...]} com as páginas que respondem
#   evidence   expressão regular que aparece em toda página de expected (maiúsculas e minúsculas
#              não importam; hifenização de fim de linha é desfeita antes). Confere o gabarito
#              com o texto extraído: rode `manu-eval --check` depois de qualquer mudança.
#   no_answer  true quando nenhum manual responde (use no lugar de expected e evidence)
#
# `page` é o número que o manual traz impresso. Nos manuais em folha de impressão (ME3EP, ME41X,
# MTO30), é o número impresso no painel, não a posição no PDF.
#
# Onde a mesma informação aparece em mais de um manual (os três Brastemp de geladeira são quase
# idênticos; o IM7 repete o G0045837; os micro-ondas Electrolux dividem texto), todos entram em
# expected: basta um deles no top-k para contar como acerto.
#
# Rode a avaliação com: manu-eval

